campaign:
  name: Lambda Resilience Test
  continue_on_failure: false

cloud:
  provider: aws

template: true

experiments:
  - service: lambda
    experiment: lambda-memory
    variables:
      lambda_name: replace-with-lambda-name
      aws_region: eu-central-1
      target_memory_size: 256
      wait_seconds: PT30S

  - service: lambda
    experiment: lambda-timeout
    variables:
      lambda_name: replace-with-lambda-name
      aws_region: eu-central-1
      target_timeout: 10
      wait_seconds: PT30S
