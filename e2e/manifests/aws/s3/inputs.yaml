# Run from the repository root: all S3 experiments in one combined campaign.
# Live execution: use approved non-production resources only.
# Omit --e2e-execute to check discovery and planning without injecting faults.
# The override below affects Bucket Policy only; it does not filter experiments.

version: 1

command: |
  scripts/run-e2e-webui \
    --e2e-mode tags \
    --e2e-cloud aws \
    --e2e-components s3 \
    --e2e-aws-region eu-central-1 \
    --e2e-tag Chaosforge=E2E-Test \
    --e2e-campaign-mode combined \
    --e2e-inputs e2e/manifests/aws/s3/inputs.yaml \
    --e2e-execute

components:
  s3:
    experiments:
      s3-bucket-policy:
        policy_template: deny-delete