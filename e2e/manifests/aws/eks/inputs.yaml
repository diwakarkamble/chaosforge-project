# Run from the repository root against an approved non-production EKS workload.
# The tagged EKS cluster is resolved dynamically; namespace and pod remain
# explicit so tag mode never chooses a Kubernetes workload ambiguously.

version: 1

command: |
  scripts/run-e2e-webui \
    --e2e-mode tags \
    --e2e-cloud aws \
    --e2e-components eks \
    --e2e-experiment eks:eks-container-restart \
    --e2e-aws-region eu-central-1 \
    --e2e-tag Chaosforge=E2E-Test \
    --e2e-campaign-mode combined \
    --e2e-strict-missing-resource \
    --e2e-inputs e2e/manifests/aws/eks/inputs.yaml \
    --e2e-execute

components:
  eks:
    experiments:
      eks-container-restart:
        aws_region: eu-central-1
        namespace: sample-app
        pod_name: replace-with-a-tagged-workload-pod
