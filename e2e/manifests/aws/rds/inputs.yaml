# Run from the repository root. This command requests live fault execution.
# Use approved non-production RDS resources only; the test instance is private.
# Tag exactly one DB instance with Chaosforge=E2E-Test in eu-central-1.
# RDS instance modifications can take several minutes and interrupt availability.
# The IOPS test lowers the provisioned IOPS from 2000 to 1000, then rolls back.
# The instance-class test changes db.t4g.medium to db.t4g.large, then rolls back.
# FIS reboot-instance is included and requires the configured FIS execution role.
# FIS failover-db-cluster is not included: tag-mode E2E cannot currently resolve
# rds-cluster targets, and the Aurora test cluster needs writer/reader members.

version: 1

command: |
  scripts/run-e2e-webui \
    --e2e-mode tags \
    --e2e-cloud aws \
    --e2e-components rds \
    --e2e-experiment rds:rds-instance-class \
    --e2e-experiment rds:rds-backup-retention \
    --e2e-experiment rds:rds-auto-minor-version-upgrade \
    --e2e-experiment rds:rds-deletion-protection \
    --e2e-experiment rds:rds-storage-autoscaling \
    --e2e-experiment rds:rds-iops \
    --e2e-experiment rds:reboot-instance \
    --e2e-aws-region eu-central-1 \
    --e2e-aws-fis-role-arn arn:aws:iam::XXXXXXXXX:role/chaos-fis-role \
    --e2e-tag Chaosforge=E2E-Test \
    --e2e-campaign-mode combined \
    --e2e-strict-missing-resource \
    --e2e-inputs e2e/manifests/aws/rds/inputs.yaml \
    --e2e-execute

components:
  rds:
    experiments:
      rds-instance-class:
        target_instance_class: db.t4g.large
        wait_seconds: 30
      rds-backup-retention:
        target_backup_retention_period: 2
        wait_seconds: 30
      rds-auto-minor-version-upgrade:
        target_auto_minor_version_upgrade: false
        wait_seconds: 30
      rds-deletion-protection:
        target_deletion_protection: true
        wait_seconds: 30
      rds-storage-autoscaling:
        threshold_percent: 80
        wait_seconds: 30
      rds-iops:
        threshold_percent: 50
        wait_seconds: 30

