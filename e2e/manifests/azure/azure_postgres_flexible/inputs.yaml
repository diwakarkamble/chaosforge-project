# Azure service: Azure Database for PostgreSQL Flexible Server
# Generated from the service experiments/metadata.json.
# Review the experiment descriptions and safety requirements before execution.
# Use only approved non-production resources and the correct Azure subscription.
# Required CHANGE_ME values must be replaced before running the affected experiment.
# Resource selectors and Chaos identity fields are supplied through discovery/CLI options.
# Live execution is explicitly enabled in the command below; review it before use.

version: 1

command: |
  scripts/run-e2e-webui
    --e2e-mode tags
    --e2e-cloud azure
    --e2e-components azure_postgres_flexible
    --e2e-tag Chaosforge=E2E-Test
    --e2e-campaign-mode combined
    --e2e-inputs e2e/manifests/azure/azure_postgres_flexible/inputs.yaml
    --e2e-execute

components:
  azure_postgres_flexible:
    experiments:
      "azure-postgres-flexible-toolkit-stop":
        # Stops the selected PostgreSQL Flexible Server and restores its captured running state after the configured duration.
        duration_seconds: 300
        # Metadata range for duration_seconds: 1 to 3600
      "azure-postgres-flexible-restart":
        # Restart a PostgreSQL Flexible Server using the Azure SDK.
        {}
      "azure-postgres-flexible-firewall-disruption":
        # Remove one existing firewall rule for the configured duration and restore its exact address range during rollback.
        rule_name: "chaosforge-e2e-test"
        duration_seconds: 300
        # Metadata range for duration_seconds: 1 to 3600
