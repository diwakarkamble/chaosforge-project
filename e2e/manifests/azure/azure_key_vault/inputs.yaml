# Azure service: Azure Key Vault
# Generated from the service experiments/metadata.json.
# Review the experiment descriptions and safety requirements before execution.
# Use only approved non-production resources and the correct Azure subscription.
# Required CHANGE_ME values must be replaced before running the affected experiment.
# Resource selectors and Chaos identity fields are supplied through discovery/CLI options.
# Live execution is explicitly enabled in the command below; review it before use.

version: 1

command: |
  scripts/run-e2e-webui \
    --e2e-mode tags \
    --e2e-cloud azure \
    --e2e-components azure_key_vault \
    --e2e-tag Chaosforge=E2E-Test \
    --e2e-campaign-mode combined \
    --e2e-inputs e2e/manifests/azure/azure_key_vault/inputs.yaml \
    --e2e-execute

components:
  azure_key_vault:
    experiments:
      "azure-key-vault-deny-access":
        # Azure Chaos Studio classic Key Vault deny access fault.
        duration: "PT5M"
      "azure-key-vault-disable-certificate":
        # Azure Chaos Studio temporarily disables a certificate and restores it after the configured duration.
        certificate_name: "CHANGE_ME"
        duration: "PT5M"
      "azure-key-vault-increment-certificate-version":
        # Azure Chaos Studio classic Key Vault certificate version increment. This discrete action creates a new version and is not automatically reverted.
        certificate_name: "CHANGE_ME"
      "azure-key-vault-update-certificate-policy":
        # Azure Chaos Studio temporarily changes the certificate policy enabled setting and restores it after the configured duration.
        certificate_name: "CHANGE_ME"
        enabled: false
        duration: "PT5M"
      "azure-key-vault-secret-disable":
        # Disable a secret version for the configured duration and restore its previous enabled state during rollback.
        secret_name: "CHANGE_ME"
        duration_seconds: 300
        # Metadata range for duration_seconds: 1 to 3600
