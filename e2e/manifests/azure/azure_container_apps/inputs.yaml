# Azure service: Azure Container Apps
# Generated from the service experiments/metadata.json.
# Review the experiment descriptions and safety requirements before execution.
# Use only approved non-production resources and the correct Azure subscription.
# Required CHANGE_ME values must be replaced before running the affected experiment.
# Resource selectors and Chaos identity fields are supplied through discovery/CLI options.
# Live execution is explicitly enabled in the command below; review it before use.

version: 1

command: |
  scripts/run-e2e-webui \
    --e2e-mode tags \
    --e2e-cloud azure \
    --e2e-components azure_container_apps \
    --e2e-tag Chaosforge=E2E-Test \
    --e2e-campaign-mode combined \
    --e2e-inputs e2e/manifests/azure/azure_container_apps/inputs.yaml \
    --e2e-execute

components:
  azure_container_apps:
    experiments:
      "azure-container-app-revision-restart":
        # Restart one active Container Apps revision.
        revision_name: "CHANGE_ME"
      "azure-container-app-traffic-shift":
        # Direct traffic to one revision for the configured duration and restore the prior traffic weights during rollback.
        revision_name: "CHANGE_ME"
        weight: 100
        duration_seconds: 300
        # Metadata range for duration_seconds: 1 to 3600
      "azure-container-app-scale-zero":
        # Deactivate a revision for the configured duration and restore its original active state during rollback.
        revision_name: "CHANGE_ME"
        duration_seconds: 300
        # Metadata range for duration_seconds: 1 to 3600
